name: Release Desktop Builds

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      version_core:
        required: true
        type: string
      source_date_epoch:
        required: true
        type: string
      build_date:
        required: true
        type: string
      build_number:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: 1.25.13
  NODE_VERSION: 22.22.1
  WAILS_VERSION: v2.10.2
  GOFLAGS: -mod=readonly

jobs:
  macos:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install locked build dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install pinned Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Build universal application
        working-directory: desktop
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_DATE: ${{ inputs.build_date }}
        run: |
          commit=$(git rev-parse HEAD)
          ldflags="-s -w -X github.com/ajramos/giztui/internal/version.Version=${RELEASE_VERSION} -X github.com/ajramos/giztui/internal/version.GitCommit=${commit} -X github.com/ajramos/giztui/internal/version.GitBranch=${RELEASE_TAG} -X github.com/ajramos/giztui/internal/version.BuildDate=${RELEASE_BUILD_DATE} -X github.com/ajramos/giztui/internal/version.BuildUser=github-actions"
          wails build -clean -platform darwin/universal -ldflags "$ldflags"

      - name: Assert macOS package metadata
        working-directory: desktop
        env:
          VERSION_CORE: ${{ inputs.version_core }}
        run: |
          plist="build/bin/GizTUI Desktop.app/Contents/Info.plist"
          test -f "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.ajramos.giztui.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION_CORE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "${{ inputs.build_number }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "12.0"

      - name: Package macOS artifacts
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
        run: |
          mkdir -p dist dmg-root
          touch -t "$(date -u -r "$SOURCE_DATE_EPOCH" +%Y%m%d%H%M.%S)" "build/bin/GizTUI Desktop.app"
          ditto "build/bin/GizTUI Desktop.app" "dmg-root/GizTUI Desktop.app"
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "GizTUI Desktop" -srcfolder dmg-root -ov -format UDZO "dist/GizTUI-Desktop-${RELEASE_VERSION}-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "build/bin/GizTUI Desktop.app" "dist/GizTUI-Desktop-${RELEASE_VERSION}-macOS-universal.zip"
          test -s "dist/GizTUI-Desktop-${RELEASE_VERSION}-universal.dmg"
          test -s "dist/GizTUI-Desktop-${RELEASE_VERSION}-macOS-universal.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-macos
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  windows:
    name: Windows amd64
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install locked build dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install pinned packaging tools
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 --yes --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          go install github.com/wailsapp/wails/v2/cmd/wails@${env:WAILS_VERSION}

      - name: Build application and installer
        shell: pwsh
        working-directory: desktop
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_DATE: ${{ inputs.build_date }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          VERSION_CORE: ${{ inputs.version_core }}
        run: |
          $commit = git rev-parse HEAD
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          $versionInfo = @{
            fixed = @{ file_version = "$env:VERSION_CORE.$env:RELEASE_BUILD_NUMBER" }
            info = @{ "0000" = @{
              ProductVersion = $env:RELEASE_VERSION
              FileVersion = "$env:VERSION_CORE.$env:RELEASE_BUILD_NUMBER"
              CompanyName = "GizTUI"
              FileDescription = "GizTUI Desktop"
              LegalCopyright = "Copyright 2026 GizTUI contributors"
              ProductName = "GizTUI Desktop"
              Comments = "A visual Gmail client reusing the GizTUI service layer."
            }}
          }
          $versionInfo | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 build/windows/info.json
          New-Item -ItemType Directory -Force -Path build/windows/installer | Out-Null
          $installerTemplate = Get-Content ../packaging/windows/project.nsi -Raw
          $installerTemplate = $installerTemplate.Replace("@DISPLAY_VERSION@", $env:RELEASE_VERSION).Replace("@NUMERIC_VERSION@", "$env:VERSION_CORE.$env:RELEASE_BUILD_NUMBER")
          Set-Content -Encoding utf8 build/windows/installer/project.nsi $installerTemplate
          $ldflags = "-s -w -X github.com/ajramos/giztui/internal/version.Version=$env:RELEASE_VERSION -X github.com/ajramos/giztui/internal/version.GitCommit=$commit -X github.com/ajramos/giztui/internal/version.GitBranch=$env:RELEASE_TAG -X github.com/ajramos/giztui/internal/version.BuildDate=$env:RELEASE_BUILD_DATE -X github.com/ajramos/giztui/internal/version.BuildUser=github-actions"
          wails build -clean -platform windows/amd64 -nsis -ldflags $ldflags

      - name: Assert Windows package metadata and package artifacts
        shell: pwsh
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VERSION_CORE: ${{ inputs.version_core }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          $portable = Get-Item "build/bin/GizTUI Desktop.exe"
          if ($portable.VersionInfo.ProductVersion -ne $env:RELEASE_VERSION) {
            throw "ProductVersion $($portable.VersionInfo.ProductVersion) does not equal $env:RELEASE_VERSION"
          }
          if (-not $portable.VersionInfo.FileVersion.StartsWith("$env:VERSION_CORE.$env:RELEASE_BUILD_NUMBER")) {
            throw "FileVersion $($portable.VersionInfo.FileVersion) does not start with $env:VERSION_CORE.$env:RELEASE_BUILD_NUMBER"
          }
          $installers = @(Get-ChildItem "build/bin" -Filter "*installer.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          if ($installers[0].VersionInfo.ProductVersion -ne $env:RELEASE_VERSION) {
            throw "Installer ProductVersion $($installers[0].VersionInfo.ProductVersion) does not equal $env:RELEASE_VERSION"
          }
          if (-not $installers[0].VersionInfo.FileVersion.StartsWith("$env:VERSION_CORE.$env:RELEASE_BUILD_NUMBER")) {
            throw "Installer FileVersion $($installers[0].VersionInfo.FileVersion) does not start with $env:VERSION_CORE.$env:RELEASE_BUILD_NUMBER"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $installers[0].FullName "dist/GizTUI-Desktop-$env:RELEASE_VERSION-windows-amd64-installer.exe"
          Compress-Archive -Path $portable.FullName -DestinationPath "dist/GizTUI-Desktop-$env:RELEASE_VERSION-windows-amd64-portable.zip"
          if ((Get-Item "dist/GizTUI-Desktop-$env:RELEASE_VERSION-windows-amd64-installer.exe").Length -eq 0) { throw "empty installer" }
          if ((Get-Item "dist/GizTUI-Desktop-$env:RELEASE_VERSION-windows-amd64-portable.zip").Length -eq 0) { throw "empty portable archive" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-windows
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  linux:
    name: Linux amd64
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential desktop-file-utils libgtk-3-dev libwebkit2gtk-4.0-dev librsvg2-bin

      - name: Install locked build dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Install pinned Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Build Linux application
        working-directory: desktop
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_DATE: ${{ inputs.build_date }}
        run: |
          commit=$(git rev-parse HEAD)
          ldflags="-s -w -X github.com/ajramos/giztui/internal/version.Version=${RELEASE_VERSION} -X github.com/ajramos/giztui/internal/version.GitCommit=${commit} -X github.com/ajramos/giztui/internal/version.GitBranch=${RELEASE_TAG} -X github.com/ajramos/giztui/internal/version.BuildDate=${RELEASE_BUILD_DATE} -X github.com/ajramos/giztui/internal/version.BuildUser=github-actions"
          wails build -clean -platform linux/amd64 -ldflags "$ldflags"

      - name: Package Linux tarball
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
        run: |
          mkdir -p dist tar-root
          install -m 0755 "build/bin/GizTUI Desktop" "tar-root/giztui-desktop"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -C tar-root -czf "dist/GizTUI-Desktop-${RELEASE_VERSION}-linux-amd64.tar.gz" giztui-desktop
          test -s "dist/GizTUI-Desktop-${RELEASE_VERSION}-linux-amd64.tar.gz"

      - name: Download and verify pinned AppImage tooling
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --show-error --location \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output linuxdeploy \
            https://api.github.com/repos/linuxdeploy/linuxdeploy/releases/assets/497463883
          echo "421ca71d5c69ea97c6309276232990d43df1dcece0edfaa26bbf926ff96ed12e  linuxdeploy" | sha256sum --check
          curl --fail --show-error --location \
            --output linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh
          echo "b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171  linuxdeploy-plugin-gtk.sh" | sha256sum --check
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh

      - name: Build AppImage
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          VERSION: ${{ inputs.version }}
          OUTPUT: GizTUI-Desktop.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          install -m 0755 "build/bin/GizTUI Desktop" AppDir/usr/bin/giztui-desktop
          cat > AppDir/usr/share/applications/giztui-desktop.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=GizTUI Desktop
          Comment=Visual Gmail client
          Exec=giztui-desktop
          Icon=giztui
          Categories=Network;Email;
          Terminal=false
          DESKTOP
          desktop-file-validate AppDir/usr/share/applications/giztui-desktop.desktop
          convert build/appicon.png -resize 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/giztui.png
          ./linuxdeploy --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/giztui-desktop.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/giztui.png \
            --plugin gtk --output appimage
          test -s GizTUI-Desktop.AppImage
          mv GizTUI-Desktop.AppImage "dist/GizTUI-Desktop-${RELEASE_VERSION}-linux-amd64.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-linux
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
