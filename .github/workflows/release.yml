name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.25.13
  NODE_VERSION: 22.22.1
  RELEASE_TAG: ${{ github.ref_name }}
  GOFLAGS: -mod=readonly

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      version_core: ${{ steps.metadata.outputs.version_core }}
      sha: ${{ steps.metadata.outputs.sha }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for metadata validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate tag, versions, changelog, and main ancestry
        run: ./scripts/validate-release.sh "$RELEASE_TAG"

      - name: Require the protected CI check for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          conclusion=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "required")] | sort_by(.completed_at) | last | .conclusion')
          if [[ $conclusion != "success" ]]; then
            echo "required CI check for ${sha} is ${conclusion:-missing}" >&2
            exit 1
          fi

      - name: Export immutable release metadata
        id: metadata
        run: |
          version=${RELEASE_TAG#v}
          version_core=${version%%[-+]*}
          sha=$(git rev-parse HEAD)
          source_date_epoch=$(git show -s --format=%ct HEAD)
          build_date=$(git show -s --format=%cI HEAD)
          build_number=$(git rev-list --count HEAD)
          test "$sha" = "$GITHUB_SHA"
          test "$build_number" -le 65535
          prerelease=false
          precedence=${version%%+*}
          if [[ $precedence == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${version}"
            echo "version_core=${version_core}"
            echo "sha=${sha}"
            echo "source_date_epoch=${source_date_epoch}"
            echo "build_date=${build_date}"
            echo "build_number=${build_number}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  cli:
    name: Build CLI artifacts
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Cross-build CLI binaries
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_BUILD_DATE: ${{ needs.validate.outputs.build_date }}
        run: |
          mkdir -p build dist
          ldflags="-s -w -X github.com/ajramos/giztui/internal/version.Version=${RELEASE_VERSION} -X github.com/ajramos/giztui/internal/version.GitCommit=${RELEASE_SHA} -X github.com/ajramos/giztui/internal/version.GitBranch=${RELEASE_TAG} -X github.com/ajramos/giztui/internal/version.BuildDate=${RELEASE_BUILD_DATE} -X github.com/ajramos/giztui/internal/version.BuildUser=github-actions"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            if [[ $os == windows ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=true -ldflags="$ldflags" -o "build/giztui-${os}-${arch}${suffix}" ./cmd/giztui
          done
          version_output=$(./build/giztui-linux-amd64 --version)
          grep -Fqx "GizTUI ${RELEASE_VERSION}" <<< "$version_output"
          grep -Fqx "Git commit: ${RELEASE_SHA}" <<< "$version_output"

      - name: Create normalized CLI archives
        env:
          SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.source_date_epoch }}
        run: |
          touch --date="@${SOURCE_DATE_EPOCH}" build/giztui-*
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -C build -czf "dist/giztui-${target}.tar.gz" "giztui-${target}"
          done
          for target in windows-amd64 windows-arm64; do
            (cd build && zip -X "../dist/giztui-${target}.zip" "giztui-${target}.exe")
          done
          test "$(find dist -type f | wc -l)" -eq 6

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cli
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  sbom:
    name: Generate SBOMs
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install locked frontend dependency tree
        working-directory: desktop/frontend
        run: npm ci

      - name: Generate reproducible CycloneDX documents
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p dist
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 mod -json -noserial -notimestamp -output "dist/giztui-cli-${RELEASE_VERSION}.cdx.json" .
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 mod -json -noserial -notimestamp -output "dist/giztui-desktop-go-${RELEASE_VERSION}.cdx.json" ./desktop
          (cd desktop/frontend && ./node_modules/.bin/cyclonedx-npm --package-lock-only --output-reproducible --validate --output-file "../../dist/giztui-desktop-frontend-${RELEASE_VERSION}.cdx.json")
          jq --exit-status --arg version "v${RELEASE_VERSION}" '.metadata.component.version == $version' "dist/giztui-cli-${RELEASE_VERSION}.cdx.json"
          jq --exit-status --arg version "v${RELEASE_VERSION}" '.metadata.component.version == $version' "dist/giztui-desktop-go-${RELEASE_VERSION}.cdx.json"
          jq --exit-status --arg version "${RELEASE_VERSION}" '.metadata.component.version == $version' "dist/giztui-desktop-frontend-${RELEASE_VERSION}.cdx.json"
          test "$(find dist -type f | wc -l)" -eq 3

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  desktop:
    name: Build desktop artifacts
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/release-desktop.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      version: ${{ needs.validate.outputs.version }}
      version_core: ${{ needs.validate.outputs.version_core }}
      source_date_epoch: ${{ needs.validate.outputs.source_date_epoch }}
      build_date: ${{ needs.validate.outputs.build_date }}
      build_number: ${{ needs.validate.outputs.build_number }}
      sha: ${{ needs.validate.outputs.sha }}

  publish:
    name: Publish complete release
    needs: [validate, cli, sbom, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out exact release tag without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download every mandatory build artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Validate the complete artifact set and generate Homebrew cask
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          expected=(
            giztui-linux-amd64.tar.gz
            giztui-linux-arm64.tar.gz
            giztui-darwin-amd64.tar.gz
            giztui-darwin-arm64.tar.gz
            giztui-windows-amd64.zip
            giztui-windows-arm64.zip
            "GizTUI-Desktop-${RELEASE_VERSION}-universal.dmg"
            "GizTUI-Desktop-${RELEASE_VERSION}-macOS-universal.zip"
            "GizTUI-Desktop-${RELEASE_VERSION}-windows-amd64-installer.exe"
            "GizTUI-Desktop-${RELEASE_VERSION}-windows-amd64-portable.zip"
            "GizTUI-Desktop-${RELEASE_VERSION}-linux-amd64.AppImage"
            "GizTUI-Desktop-${RELEASE_VERSION}-linux-amd64.tar.gz"
            "giztui-cli-${RELEASE_VERSION}.cdx.json"
            "giztui-desktop-go-${RELEASE_VERSION}.cdx.json"
            "giztui-desktop-frontend-${RELEASE_VERSION}.cdx.json"
          )
          for artifact in "${expected[@]}"; do
            test -s "release/${artifact}" || { echo "missing release artifact: ${artifact}" >&2; exit 1; }
          done
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          dmg_sha=$(sha256sum "release/GizTUI-Desktop-${RELEASE_VERSION}-universal.dmg" | cut -d ' ' -f 1)
          sed -e "s/version \"[^\"]*\"/version \"${RELEASE_VERSION}\"/" \
            -e "s/sha256 .*/sha256 \"${dmg_sha}\"/" \
            packaging/homebrew/giztui-desktop.rb > release/giztui-desktop.rb
          ruby -c release/giztui-desktop.rb
          (cd release && sha256sum -- ./* > SHA256SUMS)

      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/extract-release-notes.sh "$RELEASE_VERSION" "$RUNNER_TEMP/release-notes.md"

      - name: Reconfirm the tag and inspect any existing release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          remote_sha=$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | cut -f 1)
          if [[ -z $remote_sha ]]; then
            remote_sha=$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f 1)
          fi
          test "$remote_sha" = "$RELEASE_SHA" || { echo "$RELEASE_TAG moved from validated commit $RELEASE_SHA to ${remote_sha:-missing}" >&2; exit 1; }
          echo "already_published=false" >> "$GITHUB_OUTPUT"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [[ $is_draft == false ]]; then
              mkdir -p "$RUNNER_TEMP/existing-release"
              gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/existing-release"
              test "$(find "$RUNNER_TEMP/existing-release" -maxdepth 1 -type f | wc -l)" -eq "$(find release -maxdepth 1 -type f | wc -l)"
              (cd "$RUNNER_TEMP/existing-release" && sha256sum --check SHA256SUMS)
              cmp release/SHA256SUMS "$RUNNER_TEMP/existing-release/SHA256SUMS"
              for artifact in "$RUNNER_TEMP"/existing-release/*; do
                gh attestation verify "$artifact" \
                  --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                  --source-ref "refs/tags/$RELEASE_TAG" \
                  --source-digest "$RELEASE_SHA"
              done
              echo "already_published=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Attest all downloadable artifacts
        if: steps.release_state.outputs.already_published == 'false'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*

      - name: Create or resume the draft release and upload all assets
        if: steps.release_state.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--verify-tag --draft --title "GizTUI ${RELEASE_VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md")
            if [[ $PRERELEASE == true ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          while IFS= read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          gh release upload "$RELEASE_TAG" release/* --clobber
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" -eq "$(find release -maxdepth 1 -type f | wc -l)"

      - name: Publish the verified draft once
        if: steps.release_state.outputs.already_published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"

      - name: Verify published release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = "$PRERELEASE"

  homebrew:
    name: Update stable Homebrew cask
    needs: [validate, publish]
    if: needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Promote the verified cask to the tap
        env:
          SOURCE_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          test -n "$TAP_TOKEN" || { echo "HOMEBREW_TAP_TOKEN is required for stable releases" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/cask"
          GH_TOKEN=$SOURCE_TOKEN gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern giztui-desktop.rb --dir "$RUNNER_TEMP/cask"
          ruby -c "$RUNNER_TEMP/cask/giztui-desktop.rb"
          GH_TOKEN=$TAP_TOKEN gh api repos/ajramos/homebrew-giztui/contents/Casks/giztui-desktop.rb --jq .content | base64 --decode > "$RUNNER_TEMP/cask/current.rb"
          if cmp -s "$RUNNER_TEMP/cask/giztui-desktop.rb" "$RUNNER_TEMP/cask/current.rb"; then
            echo "Homebrew cask already matches ${RELEASE_VERSION}"
            exit 0
          fi
          current_version=$(awk '/^[[:space:]]*version[[:space:]]+"/ { line = $0; sub(/^[^"]*"/, "", line); sub(/".*/, "", line); print line; exit }' "$RUNNER_TEMP/cask/current.rb")
          dpkg --compare-versions "$RELEASE_VERSION" gt "$current_version" || { echo "refusing to replace Homebrew ${current_version} with ${RELEASE_VERSION}" >&2; exit 1; }
          current_sha=$(GH_TOKEN=$TAP_TOKEN gh api repos/ajramos/homebrew-giztui/contents/Casks/giztui-desktop.rb --jq .sha)
          content=$(base64 --wrap=0 "$RUNNER_TEMP/cask/giztui-desktop.rb")
          GH_TOKEN=$TAP_TOKEN gh api --method PUT repos/ajramos/homebrew-giztui/contents/Casks/giztui-desktop.rb \
            -f message="chore: update giztui-desktop to ${RELEASE_VERSION}" \
            -f content="$content" \
            -f sha="$current_sha" >/dev/null
